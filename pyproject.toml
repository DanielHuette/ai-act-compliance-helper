[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-compliance-helper"
version = "2.0.0"
description = "Classifies AI systems under the EU AI Act (Regulation (EU) 2024/1689) and the GDPR, with every answer backed by the cited legal text"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS.md"]
authors = [{ name = "Daniel Hütte" }]
keywords = ["eu-ai-act", "ai-act", "gdpr", "compliance", "high-risk-ai",
            "annex-iii", "risk-classification", "legal-tech", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "Natural Language :: English",
  "Natural Language :: German",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]

dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "numpy>=1.26",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Local embedding and reranking models for semantic search.
search = [
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2.10",
  "torch>=2.2",
]
# Answer composition through LLM provider APIs.
llm = [
  "anthropic>=0.34",
  "openai>=1.40",
]
dev = [
  "pytest>=8.2",
  # FastAPI's TestClient runs on httpx.
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  # Pinned here so CI and workstations type-check against the same stubs.
  "types-PyYAML>=6.0",
  # scripts/build_presentation.py --measure
  "playwright>=1.47",
]

[project.scripts]
compliance-helper = "compliance_helper.cli:main"

[project.urls]
Source = "https://github.com/DanielHuette/ai-act-compliance-helper"
Issues = "https://github.com/DanielHuette/ai-act-compliance-helper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compliance_helper = ["webui/**/*", "locales/**/*.json", "py.typed"]

# What an installed package needs at runtime, found by paths.root() under <prefix>/share. The
# search indexes stay out (28 MB, useless without the 2.3 GB model); the service then builds a
# fallback index per language at start, as the desktop packages do.
[tool.setuptools.data-files]
"share/ai-act-compliance-helper/data/rules" = ["data/rules/*.yaml"]
"share/ai-act-compliance-helper/data/rules/question_flow" = ["data/rules/question_flow/*.yaml"]
"share/ai-act-compliance-helper/data/cases" = ["data/cases/*.yaml"]
"share/ai-act-compliance-helper/data/processed" = [
  "data/processed/corpus*.jsonl",
  "data/processed/corpus_report*.json",
]
"share/ai-act-compliance-helper/web" = ["web/*.html", "web/*.js", "web/*.json", "web/*.svg", "web/*.jpg", "web/*.txt", "web/*.xml"]
"share/ai-act-compliance-helper/web/images" = ["web/images/*"]
"share/ai-act-compliance-helper/web/fonts" = ["web/fonts/*"]
"share/ai-act-compliance-helper/web/locales" = ["web/locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "S"]
ignore = [
  "RUF001",  # German legal text and its parsers need NBSP, en dash and non-breaking hyphen
  "UP031",  # %-format kept for width specs like "%-16s"/"%02d" and lazy logger formatting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]
# S310: urlopen on hard-coded source URLs only. S311: seeded RNG for reproducible answer
# patterns, not secrets. S603/S607: check_parity.py runs the fixed command "node" via PATH.
"scripts/*" = ["S310", "S311", "S603", "S607"]
# S310: probing 127.0.0.1. S603: launching the freshly built package is the purpose of the check.
"packaging/*" = ["S310", "S603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# These packages ship no type information; call sites annotate what they return.
module = ["FlagEmbedding.*", "anthropic.*", "openai.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs the local models, excluded from the fast run",
  "network: needs network access",
  "container: needs Docker and builds an image; skip with -m 'not container'",
]

[tool.bandit]
exclude_dirs = ["tests", "data"]
