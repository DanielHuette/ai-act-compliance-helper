# Company questions: the yardstick for classification accuracy.
#
# WHY THIS FILE EXISTS
# The 44 use cases in data/cases are the yardstick for obligations.
# They are not enough for accuracy on their own: the keyword lists were
# developed on them, and 44 of 44 there only means nothing has regressed.
#
# This file holds 100 descriptions as companies actually submit them:
# brief, in their own words, often as a question, with product names and without
# legal terms. Half from the perspective of a software company selling an AI product,
# half from the perspective of a deployer. 28 of them are "minimal": a
# checker that declares everything high-risk would be as worthless as one that
# recognises nothing. Each question is given in German and English ({de, en}); both share the expected result.
#
# The expected classification is determined from the text of the Regulation, not from what
# the checker currently returns. The field "expected_provision" names the provision on which
# the expected result rests; whoever wants to change it must read up there.
#
# MEASURED STATE (German questions)
#   keyword lists only                   55 %
#   with purpose catalog, first version 86 %
#   after working through the 14 misses 98 %
#   after the role split in Article 50 and the second route to paragraph 4
#                                       100 %  (2026-10-04)
#
# MEASURED STATE (English questions, tests/test_accuracy_en.py)
#   bilingual purpose catalog, first version            93 %
#   after rewording four English purpose sentences      97 %  (2026-10-09)
# The three remaining misses lie outside the purpose catalog: English compute
# wording ("floating-point operations"), deep fake keywords, and the German
# stem "note" (grade) matching the English word "notes".
#
# The gate in tests/test_purposes.py is 95, not 100: a
# gate that breaks at the first new purpose sentence gets raised instead of
# fixed. If the rate drops below 95, something has regressed.
as_of: "2026-10-04"
