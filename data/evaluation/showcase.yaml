# question the walkthrough asks is answered no. Scenario, Commission verdict, rationale and
# paragraph come from official_examples.json, so nothing here restates the guidelines.
#
# tests/test_showcase.py replays every entry and requires the Commission's verdict;
# scripts/export_showcase.py writes the browser copy web/showcase.json.

