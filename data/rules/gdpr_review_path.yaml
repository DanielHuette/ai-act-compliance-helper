    citation_text:
      de: "Artikel 2 Absatz 7, Artikel 10 Absatz 5, Artikel 26 Absätze 9 und 10, Artikel 27 Absatz 4, Artikel 50 Absatz 3 und Artikel 59 Absatz 1 KI-VO, dazu Artikel 13, 22, 32 und 35 DSGVO"
      en: "Article 2(7), Article 10(5), Article 26(9) and (10), Article 27(4), Article 50(3) and Article 59(1) AI Act, together with Articles 13, 22, 32 and 35 GDPR"
    action_required:
      de: "Zu tun ist: Beide Regelwerke nebeneinander erfüllen, nicht eines statt des anderen. Artikel 2 Absatz 7 KI-VO stellt klar: Das Unionsrecht zum Schutz personenbezogener Daten gilt für die Verarbeitung im Zusammenhang mit den Rechten und Pflichten der KI-Verordnung weiter, und die KI-Verordnung berührt die Datenschutz-Grundverordnung nicht, mit Ausnahme von Artikel 10 Absatz 5 und Artikel 59 KI-VO. Wo die KI-Verordnung ausdrücklich auf das Datenschutzrecht verweist: Artikel 10 Absatz 5 erlaubt Anbietern von Hochrisikosystemen die Verarbeitung besonderer Datenkategorien zur Verzerrungskorrektur zusätzlich zu den Vorgaben der Datenschutz-Grundverordnung und verlangt unter Buchstabe f einen entsprechenden Eintrag in den Aufzeichnungen über Verarbeitungstätigkeiten; Artikel 26 Absatz 9 verpflichtet Betreiber, die Anbieterinformationen aus Artikel 13 KI-VO für ihre Datenschutz-Folgenabschätzung nach Artikel 35 DSGVO zu verwenden; Artikel 27 Absatz 4 bestimmt, dass die Grundrechte-Folgenabschätzung eine bereits durchgeführte Datenschutz-Folgenabschätzung ergänzt, sie also nicht ersetzt und nicht von ihr ersetzt wird; Artikel 50 Absatz 3 verlangt bei Emotionserkennung und biometrischer Kategorisierung die Verarbeitung nach der Datenschutz-Grundverordnung; Artikel 26 Absatz 10 lässt für die Verarbeitung biometrischer Daten Artikel 9 DSGVO ausdrücklich unberührt; und Artikel 59 Absatz 1 regelt die Weiterverarbeitung rechtmässig erhobener Daten im KI-Reallabor. Doppelt auftretende Pflichten, die Sie sinnvoll zusammen bearbeiten: die Folgenabschätzungen aus Artikel 35 DSGVO und Artikel 27 KI-VO; die Transparenz gegenüber Betroffenen aus Artikel 13 und 14 DSGVO und aus Artikel 26 Absatz 11 und Artikel 50 KI-VO; die Erläuterung von Entscheidungen aus Artikel 22 Absatz 3 DSGVO und Artikel 86 KI-VO; die Sicherheitsmassnahmen aus Artikel 32 DSGVO und Artikel 15 KI-VO; und die Protokollierung aus Artikel 12, 19 und 26 Absatz 6 KI-VO, deren Aufbewahrungsfristen unter dem Vorbehalt des Datenschutzrechts stehen. Führen Sie diese Unterlagen in einem Vorgang, aber halten Sie die Fundstellen beider Rechtsakte getrennt auseinander, damit jede Behörde ihre Pflicht darin wiederfindet."
      en: "What to do: Comply with both sets of rules side by side, not one instead of the other. Article 2(7) AI Act makes clear: Union law on the protection of personal data continues to apply to processing in connection with the rights and obligations of the AI Act, and the AI Act does not affect the General Data Protection Regulation, with the exception of Article 10(5) and Article 59 AI Act. Where the AI Act expressly refers to data protection law: Article 10(5) permits providers of high-risk systems to process special categories of data to correct bias in addition to the requirements of the General Data Protection Regulation and, under point (f), requires a corresponding entry in the records of processing activities; Article 26(9) obliges deployers to use the provider information under Article 13 AI Act for their data protection impact assessment under Article 35 GDPR; Article 27(4) provides that the fundamental rights impact assessment complements a data protection impact assessment already carried out, so it neither replaces it nor is replaced by it; Article 50(3) requires processing in accordance with the General Data Protection Regulation for emotion recognition and biometric categorisation; Article 26(10) expressly leaves Article 9 GDPR unaffected for the processing of biometric data; and Article 59(1) governs the further processing of lawfully collected data in the AI regulatory sandbox. Obligations that occur twice and that you can sensibly handle together: the impact assessments under Article 35 GDPR and Article 27 AI Act; transparency towards data subjects under Articles 13 and 14 GDPR and under Article 26(11) and Article 50 AI Act; the explanation of decisions under Article 22(3) GDPR and Article 86 AI Act; the security measures under Article 32 GDPR and Article 15 AI Act; and the logging under Article 12, Article 19 and Article 26(6) AI Act, whose retention periods are subject to data protection law. Keep these records in one file, but keep the citations of the two legal acts clearly apart, so that each authority finds its own obligation in it."
    evidence_of_compliance:
      de: "Eine Gegenüberstellung je System, die zu jeder Pflicht die Fundstelle in beiden Rechtsakten, das gemeinsam genutzte Dokument und die zuständige Behörde nennt."
      en: "A comparison per system that names for each obligation the citation in both legal acts, the shared document and the competent authority."
    on_infringement:
      de: "Die Sanktionen laufen getrennt: Verstösse gegen die Datenschutz-Grundverordnung nach Artikel 83 DSGVO mit bis zu 20 000 000 Euro oder 4 Prozent beziehungsweise bis zu 10 000 000 Euro oder 2 Prozent des weltweiten Jahresumsatzes, Verstösse gegen die KI-Verordnung nach Artikel 99 KI-VO mit bis zu 35 000 000 Euro oder 7 Prozent bei verbotenen Praktiken und bis zu 15 000 000 Euro oder 3 Prozent bei den in Artikel 99 Absatz 4 genannten Pflichten. Dieselbe Handlung kann beide Rahmen auslösen."
      en: "The penalties run separately: infringements of the General Data Protection Regulation under Article 83 GDPR with up to EUR 20 000 000 or 4 %, or up to EUR 10 000 000 or 2 %, of worldwide annual turnover; infringements of the AI Act under Article 99 AI Act with up to EUR 35 000 000 or 7 % for prohibited practices and up to EUR 15 000 000 or 3 % for the obligations listed in Article 99(4). The same act can trigger both frameworks."
