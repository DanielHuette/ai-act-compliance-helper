# Classification rules of the AI Act (Regulation (EU) 2024/1689)
#
# This file is the decision tree by which the helper classifies. It is
# deliberately data and not program code: that way it can be read and checked why
# a classification comes out, and a change in the law changes a
# text file instead of a line of code.
#
# IMPORTANT: the classification is NOT made by the language model. It results from
# these rules. The language model only words the answer and must not change the
# result. Reason: an invented classification costs money and trust.
#
# Structure of a rule:
#   id             unique name, appears in the rationale
#   risk_class     which bucket the rule assigns
#   legal_basis    identifiers in the corpus - checked at build time
#   citation       how the provision is cited in the answer
#   when           conditions; all must apply (AND)
#   or_when        alternatives; one is enough
#   keywords       words in the description that trigger the rule
#   question       what the helper asks if the information is missing
#   rationale      sentence that appears in the answer
#   confidence     certain | likely | needs_review

as_of: 2026-05-31
legal_act: AI-Act
version_note:
  de: "Der Regelsatz folgt dem Verordnungstext in der Fassung des Amtsblatts vom 12. Juli 2024. Änderungen durch delegierte Rechtsakte, Leitlinien der Kommission oder ein Änderungsvorhaben nach dem genannten Stand sind hier nicht enthalten. Der Helfer sagt diesen Vorbehalt in jeder Auskunft mit.\n"
  en: "The rule set follows the text of the Regulation as published in the Official Journal of 12 July 2024. Amendments by delegated acts, Commission guidelines or an amending proposal after that date are not included here. The helper states this caveat in every answer."

# ---------------------------------------------------------------------------
# Tier 1: prohibited practices, Article 5. The check always goes here first.
# ---------------------------------------------------------------------------
prohibitions:
  - id: art5-1a-subliminal
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-a", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe a KI-VO"
      en: "Article 5(1)(a) AI Act"
    title:
      de: "Unterschwellige Beeinflussung oder manipulative Techniken"
      en: "Subliminal influence or manipulative techniques"
    when:
      - trait: subliminal_behaviour_manipulation
        actual: true
    keywords:
      de: [unterschwellig, subliminal, manipulativ, täuschend, dark pattern, verhaltensbeeinflussung, nudging verdeckt]
      en: [subliminal, manipulative, deceptive, dark pattern, behaviour manipulation, behavior manipulation, covert nudging, hidden nudging]
    question:
      de: "Beeinflusst das System das Verhalten von Menschen mit Techniken, die sie nicht bemerken können, oder mit Täuschung — so dass sie Entscheidungen treffen, die sie sonst nicht getroffen hätten und die ihnen erheblich schaden können?\n"
      en: "Does your system influence people's behaviour with techniques they cannot notice, or through deception, so that they take decisions they would not otherwise have taken and that can cause them significant harm?"
    rationale:
      de: "Techniken, die unterschwellig wirken oder täuschen und das Verhalten so verzerren, dass erheblicher Schaden entstehen kann, sind verboten.\n"
      en: "Techniques that work subliminally or deceive and distort behaviour in a way that can cause significant harm are prohibited."
    confidence: needs_review

  - id: art5-1b-vulnerability
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-b", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe b KI-VO"
      en: "Article 5(1)(b) AI Act"
    title:
      de: "Ausnutzen einer Schwäche"
      en: "Exploitation of vulnerabilities"
    when:
      - trait: exploits_vulnerabilities
        actual: true
    keywords:
      de: [kinder gezielt, minderjährige beeinflussen, behinderung ausnutzen, vulnerable gruppe, soziale lage ausnutzen, armut gezielt]
      en: [targets children, children targeted, influence minors, exploit disability, vulnerable group, exploit social situation, targets people in poverty]
    question:
      de: "Richtet sich das System gezielt an Menschen, die wegen ihres Alters, einer Behinderung oder ihrer sozialen oder wirtschaftlichen Lage besonders angreifbar sind, und nutzt es diese Lage aus?\n"
      en: "Does your system specifically target people who are particularly vulnerable because of their age, a disability or their social or economic situation, and does it exploit that situation?"
    rationale:
      de: "Das Ausnutzen von Alter, Behinderung oder sozialer und wirtschaftlicher Lage zur Verhaltensverzerrung mit erheblichem Schadenspotenzial ist verboten.\n"
      en: "Exploiting age, disability or a social and economic situation to distort behaviour with a potential for significant harm is prohibited."
    confidence: needs_review

  - id: art5-1c-social-scoring
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-c", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe c KI-VO"
      en: "Article 5(1)(c) AI Act"
    title:
      de: "Soziale Bewertung von Menschen"
      en: "Social scoring of people"
    when:
      - trait: social_scoring
        actual: true
    keywords:
      de: [social scoring, sozialpunkte, bürgerbewertung, vertrauenswürdigkeit bewerten, verhaltensscore person, reputationsscore]
      en: [social scoring, social credit score, social points, citizen score, citizen rating, rate trustworthiness, trustworthiness score, behaviour score person, behavior score person, reputation score]
    question:
      de: "Bewertet oder stuft das System Menschen nach ihrem Sozialverhalten oder nach persönlichen Eigenschaften ein, und wird diese Bewertung in einem anderen Zusammenhang verwendet als dem, in dem die Daten entstanden sind — oder führt sie zu einer Benachteiligung, die nicht verhältnismäßig ist?\n"
      en: "Does your system evaluate or classify people based on their social behaviour or personal characteristics, and is this score used in a context other than the one in which the data were generated, or does it lead to detrimental treatment that is disproportionate?"
    rationale:
      de: "Soziale Bewertung mit Benachteiligung in fremden Zusammenhängen oder ohne Verhältnismäßigkeit ist verboten.\n"
      en: "Social scoring with detrimental treatment in unrelated contexts or without proportionality is prohibited."
    confidence: needs_review

  - id: art5-1d-crime-prediction
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-d", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe d KI-VO"
      en: "Article 5(1)(d) AI Act"
    title:
      de: "Vorhersage von Straftaten allein aus Profiling"
      en: "Predicting criminal offences based solely on profiling"
    when:
      - trait: individual_crime_prediction
        actual: true
    # The prohibition requires that the prediction is based SOLELY on
    # profiling. If this word is missing, the prohibition is not met:
    # a recidivism forecast for the police then falls under Annex III
    # point 6(d), i.e. high risk with obligations instead of a prohibition. For
    # the user this is the difference between carrying on with conditions and
    # shutting down - it must not hinge on the similarity of a phrase.
    # As measured, the word "Rueckfall" (recidivism) alone used to trigger the prohibition.
    required_wording:
      de: [ausschliesslich, ausschließlich, allein, einzig, nur aufgrund, nur anhand, nur auf der grundlage, lediglich, ausschliessliche, ausschließliche]
      en: [solely, exclusively, sole basis, only on the basis, on the basis alone, only because of, based only on, only based on, only by means of, only through profiling, only from profiling, only by profiling, purely on the basis, merely on the basis, purely based on, exclusive basis]
    keywords:
      de: [predictive policing person, straftat vorhersagen, rückfallrisiko profiling, kriminalitätsprognose person]
      en: [predictive policing person, predict crime, predict criminal offence, predict offences, recidivism risk profiling, reoffending risk profiling, crime prediction person, crime forecast person]
    question:
      de: "Schätzt das System das Risiko ein, dass eine bestimmte Person eine Straftat begeht, und stützt sich dabei allein auf Profiling oder auf Persönlichkeitsmerkmale?\n"
      en: "Does your system assess the risk that a specific person will commit a criminal offence, and does it rely solely on profiling or on personality traits to do so?"
    rationale:
      de: "Die Risikobewertung einzelner Menschen auf Straftaten allein aus Profiling oder Persönlichkeitsmerkmalen ist verboten. Erlaubt bleibt die Unterstützung einer menschlichen Bewertung, die auf objektiven, überprüfbaren und unmittelbar mit einer Straftat verbundenen Tatsachen beruht.\n"
      en: "Assessing the risk of individual people committing criminal offences based solely on profiling or personality traits is prohibited. Still permitted is support for a human assessment that is based on objective and verifiable facts directly linked to a criminal activity."
    confidence: needs_review

  - id: art5-1e-facial-database
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-e", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe e KI-VO"
      en: "Article 5(1)(e) AI Act"
    title:
      de: "Ungezieltes Auslesen von Gesichtsbildern"
      en: "Untargeted scraping of facial images"
    when:
      - trait: untargeted_facial_image_scraping
        actual: true
    keywords:
      de: [gesichter scrapen, gesichtsdatenbank aufbauen, bilder aus internet sammeln gesicht, videoüberwachung gesichter sammeln]
      en: [scrape faces, build face database, build facial recognition database, collect face images from the internet, collect faces from cctv, collect faces from video surveillance]
    question:
      de: "Baut das System eine Gesichtserkennungsdatenbank auf, indem es Gesichtsbilder ungezielt aus dem Internet oder aus Videoüberwachung ausliest?\n"
      en: "Does your system build a facial recognition database by scraping facial images untargeted from the internet or from CCTV footage?"
    rationale:
      de: "Der Aufbau von Gesichtserkennungsdatenbanken durch ungezieltes Auslesen von Gesichtsbildern aus dem Internet oder aus Videoüberwachung ist verboten.\n"
      en: "Building facial recognition databases through untargeted scraping of facial images from the internet or from CCTV footage is prohibited."
    confidence: certain

  - id: art5-1f-emotion-work-education
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-f", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe f KI-VO"
      en: "Article 5(1)(f) AI Act"
    title:
      de: "Emotionserkennung am Arbeitsplatz und in der Bildung"
      en: "Emotion recognition in the workplace and in education"
    when:
      - trait: emotion_recognition
        actual: true
      - trait: workplace_or_education
        actual: true
    keywords:
      de: [emotionserkennung mitarbeiter, stimmung beschäftigte, emotion schüler, aufmerksamkeit prüfung messen, bewerbergefühl]
      en: [emotion recognition employees, employee mood, emotion students, emotion pupils, measure attention exams, applicant emotions, candidate emotions]
    question:
      de: "Erkennt oder erschließt das System Emotionen von Menschen am Arbeitsplatz oder in einer Bildungseinrichtung?\n"
      en: "Does your system recognise or infer the emotions of people in the workplace or in an education institution?"
    rationale:
      de: "Emotionserkennung am Arbeitsplatz und in Bildungseinrichtungen ist verboten. Ausnahme nur aus medizinischen Gründen oder aus Gründen der Sicherheit.\n"
      en: "Emotion recognition in the workplace and in education institutions is prohibited. The only exception is for medical or safety reasons."
    exemption:
      de: "Erlaubt bleibt der Einsatz aus medizinischen Gründen oder aus Sicherheitsgründen, etwa Müdigkeitserkennung bei Piloten.\n"
      en: "Use for medical or safety reasons remains permitted, for example fatigue detection for pilots."
    confidence: likely

  - id: art5-1g-biometric-categorisation
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-g", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe g KI-VO"
      en: "Article 5(1)(g) AI Act"
    title:
      de: "Biometrische Kategorisierung nach geschützten Merkmalen"
      en: "Biometric categorisation by protected characteristics"
    when:
      - trait: biometrics
        actual: true
      - trait: infers_protected_characteristics
        actual: true
    keywords:
      de: [ethnie erkennen, hautfarbe klassifizieren, religion ableiten, sexuelle orientierung erkennen, politische meinung ableiten, gewerkschaft erkennen]
      en: [detect ethnicity, infer ethnicity, classify skin colour, classify skin color, infer religion, detect sexual orientation, infer sexual orientation, infer political opinion, detect trade union membership, infer trade union membership]
    question:
      de: "Ordnet das System Menschen anhand biometrischer Daten Kategorien zu, um ihre Rasse, politische Meinung, Gewerkschaftszugehörigkeit, religiöse oder philosophische Überzeugung, ihr Sexualleben oder ihre sexuelle Orientierung abzuleiten?\n"
      en: "Does your system assign people to categories based on their biometric data in order to deduce or infer their race, political opinions, trade union membership, religious or philosophical beliefs, sex life or sexual orientation?"
    rationale:
      de: "Biometrische Kategorisierung zur Ableitung dieser geschützten Merkmale ist verboten.\n"
      en: "Biometric categorisation to infer these protected characteristics is prohibited."
    exemption:
      de: "Nicht erfasst ist die Kennzeichnung oder Filterung rechtmäßig erworbener biometrischer Datensätze, etwa das Sortieren von Bildern.\n"
      en: "Not covered is the labelling or filtering of lawfully acquired biometric datasets, such as sorting images."
    confidence: likely

  - id: art5-1h-realtime-remote-identification
    risk_class: prohibited
    legal_basis: ["AI-Act/art-5/para-1-h", "AI-Act/art-5"]
    citation:
      de: "Artikel 5 Absatz 1 Buchstabe h KI-VO"
      en: "Article 5(1)(h) AI Act"
    title:
      de: "Biometrische Echtzeit-Fernidentifizierung im öffentlichen Raum"
      en: "Real-time remote biometric identification in publicly accessible spaces"
    when:
      - trait: realtime_remote_biometric_identification
        actual: true
      - trait: publicly_accessible_space
        actual: true
      - trait: law_enforcement_purpose
        actual: true
    keywords:
      de: [gesichtserkennung öffentlicher raum, echtzeit identifizierung kamera, biometrische überwachung polizei]
      en: [facial recognition public space, facial recognition publicly accessible, real-time identification camera, biometric surveillance policing, biometric surveillance law enforcement]
    question:
      de: "Identifiziert das System Menschen biometrisch in Echtzeit in öffentlich zugänglichen Räumen, und zwar zu Zwecken der Strafverfolgung?\n"
      en: "Does your system identify people biometrically in real time in publicly accessible spaces, and does it do so for the purpose of law enforcement?"
    rationale:
      de: "Biometrische Echtzeit-Fernidentifizierung in öffentlich zugänglichen Räumen zu Strafverfolgungszwecken ist verboten, von engen Ausnahmen abgesehen.\n"
      en: "Real-time remote biometric identification in publicly accessible spaces for the purpose of law enforcement is prohibited, apart from narrow exceptions."
    exemption:
      de: "Enge Ausnahmen bestehen für die gezielte Suche nach Opfern bestimmter Straftaten, die Abwehr einer konkreten und gegenwärtigen Gefahr für Leben oder körperliche Unversehrtheit sowie die Lokalisierung Verdächtiger bestimmter schwerer Straftaten — jeweils mit vorheriger richterlicher oder behördlicher Genehmigung und einer Grundrechte-Folgenabschätzung.\n"
      en: "Narrow exceptions exist for the targeted search for victims of certain criminal offences, the prevention of a specific and present threat to life or physical safety and the localisation of suspects of certain serious criminal offences, in each case with prior authorisation by a judicial or administrative authority and a fundamental rights impact assessment."
    confidence: likely

# ---------------------------------------------------------------------------
# Tier 2: high risk via product safety law, Article 6(1)
# ---------------------------------------------------------------------------
high_risk_annex_i:
  id: art6-1-product-safety
  risk_class: high_risk_annex_i
  legal_basis: ["AI-Act/art-6/para-1", "AI-Act/annex-I"]
  citation:
    de: "Artikel 6 Absatz 1 KI-VO in Verbindung mit Anhang I"
    en: "Article 6(1) AI Act in conjunction with Annex I"
  applies_from: 2027-08-02
  when:
    - trait: embedded_in_product
      actual: true
    - trait: product_under_annex_i
      actual: true
    - trait: third_party_conformity_assessment
      actual: true
  # The product category alone is not enough: a machine manufacturer who only
  # translates its manuals builds nothing into the machine. Hence the
  # phrases here require category and embedding together. On their own, only
  # the categories that are themselves the product as software match.
  keywords:
    de: [medizinprodukt, in verkehr gebrachtes medizinprodukt, sicherheitsbauteil maschine, steuerung der maschine, maschine eingebaut, bauteil der maschine, aufzugssteuerung, spielzeug eingebaut, druckgerät steuerung, funkanlage eingebaut, fahrzeugbauteil, fahrzeugtypgenehmigung, bauteil fahrzeug, fahrzeug eingebaut, notbremsassistent, fahrerassistenz, luftfahrzeug, eisenbahnsteuerung, seilbahnsteuerung, persönliche schutzausrüstung, gasverbrauchseinrichtung]
    en: [medical device, medical device placed on the market, safety component machinery, machinery control, controls the machinery, control of the machinery, built into machinery, embedded in machinery, integrated into machinery, component of the machinery, machinery component, elevator control, lift controller, lift control system, built into toys, embedded in toys, pressure equipment control, built into radio equipment, embedded in radio equipment, vehicle component, vehicle type approval, vehicle type-approval, component of the vehicle, built into the vehicle, built into vehicles, installed in the vehicle, embedded in the vehicle, emergency braking, emergency brake assist, driver assistance, driver-assistance, aircraft, railway control, railway signalling, railway signaling, rail traffic control, cableway control, cable car control, ropeway control, personal protective equipment, gas-burning appliance, appliances burning gaseous fuels]
  question:
    de: "Ist das KI-System ein Sicherheitsbauteil eines Produkts oder selbst ein Produkt, das unter eine der in Anhang I genannten Harmonisierungsrechtsvorschriften fällt — etwa Maschinen, Medizinprodukte, Spielzeug, Aufzüge, Fahrzeuge — und muss dieses Produkt von einer dritten Stelle geprüft werden?\n"
    en: "Is the AI system a safety component of a product, or itself a product, covered by one of the Union harmonisation legislation listed in Annex I, such as machinery, medical devices, toys, lifts or vehicles, and must this product undergo a third-party conformity assessment?"
  rationale:
    de: "Ein KI-System, das Sicherheitsbauteil eines Produkts nach Anhang I ist oder selbst ein solches Produkt darstellt, gilt als Hochrisiko-KI-System, wenn für das Produkt eine Konformitätsbewertung durch Dritte verlangt wird.\n"
    en: "An AI system that is a safety component of a product under Annex I, or is itself such a product, is considered a high-risk AI system if the product is required to undergo a third-party conformity assessment."

# ---------------------------------------------------------------------------
# Tier 3: high risk via the area of use, Article 6(2), Annex III
