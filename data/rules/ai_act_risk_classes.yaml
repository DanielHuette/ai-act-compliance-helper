# ---------------------------------------------------------------------------
# Tier 4: derogation from Annex III, Article 6(3)
# ---------------------------------------------------------------------------
high_risk_exemption:
  id: art6-3-exemption
  risk_class: high_risk_exemption
  legal_basis: ["AI-Act/art-6/para-3"]
  citation:
    de: "Artikel 6 Absatz 3 KI-VO"
    en: "Article 6(3) AI Act"
  precondition:
    de: "Die Ausnahme greift nur, wenn das System kein erhebliches Risiko für Gesundheit, Sicherheit oder Grundrechte birgt und das Ergebnis der Entscheidungsfindung nicht wesentlich beeinflusst.\n"
    en: "The exemption applies only if the system does not pose a significant risk of harm to health, safety or fundamental rights and does not materially influence the outcome of decision-making."
  one_of_cases:
    - id: art6-3-a-narrow-task
      text:
        de: "Das System führt eine eng umgrenzte verfahrenstechnische Aufgabe aus."
        en: "The system performs a narrow procedural task."
      example:
        de: "Ein Modell, das unstrukturierte Eingaben in ein festes Format bringt."
        en: "A model that converts unstructured input into a fixed format."
    - id: art6-3-b-improvement
      text:
        de: "Das System verbessert das Ergebnis einer zuvor von einem Menschen ausgeführten Tätigkeit."
        en: "The system improves the result of a previously completed human activity."
      example:
        de: "Eine Sprachglättung eines bereits geschriebenen Bescheids."
        en: "Language polishing of an administrative decision that has already been written."
    - id: art6-3-c-pattern-detection
      text:
        de: "Das System erkennt Entscheidungsmuster oder Abweichungen davon und soll die vorangegangene menschliche Bewertung nicht ersetzen oder beeinflussen, ohne dass ein Mensch sie überprüft."
        en: "The system detects decision-making patterns or deviations from them and is not meant to replace or influence the previously completed human assessment without proper human review."
      example:
        de: "Eine Prüfung, ob Lehrkräfte von ihrem üblichen Notenmuster abweichen."
        en: "A check whether teachers deviate from their usual grading pattern."
    - id: art6-3-d-preparatory-task
      text:
        de: "Das System führt eine vorbereitende Aufgabe für eine Bewertung aus."
        en: "The system performs a preparatory task for an assessment."
      example:
        de: "Dateien sortieren, Akten verschlagworten, Übersetzen von Unterlagen."
        en: "Sorting files, indexing records, translating documents."
  counter_exemption:
    id: art6-3-profiling
    text:
      de: "Führt das System ein Profiling natürlicher Personen durch, gilt es immer als Hochrisiko-KI-System — die Ausnahme greift dann nicht.\n"
      en: "If the system performs profiling of natural persons, it is always considered a high-risk AI system; the exemption then does not apply."
    legal_basis: ["AI-Act/art-6/para-3"]
  follow_up_obligation:
    id: art6-4-documentation-registration
    legal_basis: ["AI-Act/art-6/para-4", "AI-Act/art-49/para-2"]
    citation:
      de: "Artikel 6 Absatz 4 und Artikel 49 Absatz 2 KI-VO"
      en: "Article 6(4) and Article 49(2) AI Act"
    text:
      de: "Wer sich auf die Ausnahme beruft, muss die Bewertung dokumentieren, bevor das System in Verkehr gebracht oder in Betrieb genommen wird, sich in der EU-Datenbank registrieren und die Bewertung den Behörden auf Verlangen vorlegen.\n"
      en: "Anyone relying on the exemption must document the assessment before the system is placed on the market or put into service, register in the EU database and provide the assessment to the authorities on request."

# ---------------------------------------------------------------------------
# Tier 5: transparency obligations, Article 50
# ---------------------------------------------------------------------------
transparency:
  applies_from: 2026-08-02
  cases:
    - id: art50-1-interaction
      risk_class: transparency
      # By its wording, paragraph 1 obliges the provider to design the system.
      # The case is also named to the deployer, though: it conducts the conversation with
      # the customer and must use the system in accordance with Article 26(1)
      # as the instructions provide - i.e. keep the notice visible. A
      # mail-order retailer that lets a bot with a human first name write in the first
      # person would otherwise get "minimal" as the answer.
      roles: [provider, deployer]
      legal_basis: ["AI-Act/art-50/para-1"]
      citation:
        de: "Artikel 50 Absatz 1 KI-VO"
        en: "Article 50(1) AI Act"
      when:
        - trait: interacts_with_people
          actual: true
      keywords:
        de: [chatbot, assistent, sprachassistent, dialog, kundenservice bot]
        en: [chatbot, assistant, voice assistant, dialogue, dialog, conversational, customer service bot]
      obligation:
        de: "Menschen müssen erfahren, dass sie mit einem KI-System sprechen — es sei denn, das ist aus den Umständen offensichtlich.\n"
        en: "People must be informed that they are interacting with an AI system, unless this is obvious from the circumstances."
    - id: art50-2-synthetic-content
      risk_class: transparency
      # Paragraph 2 stays with the provider, and not out of formalism: the
      # machine-readable marking is created in the generating system. A
      # deployer cannot apply it. Anyone using ChatGPT for advertising copy
      # used to be confronted with the obligation of the model provider - a
      # requirement they cannot fulfil is no answer.
      role: provider
      legal_basis: ["AI-Act/art-50/para-2"]
      citation:
        de: "Artikel 50 Absatz 2 KI-VO"
        en: "Article 50(2) AI Act"
      when:
        - trait: generates_content
          actual: true
      keywords:
        de: [bild erzeugen, text erzeugen, video erzeugen, audio erzeugen, synthetische inhalte, generativ]
        en: [generate images, image generation, generate text, text generation, generate video, video generation, generate audio, audio generation, synthetic content, generative]
      obligation:
        de: "Erzeugte Inhalte müssen in maschinenlesbarer Form als künstlich erzeugt oder bearbeitet gekennzeichnet sein, etwa durch Wasserzeichen oder Metadaten.\n"
        en: "Generated content must be marked in a machine-readable format as artificially generated or manipulated, for example by watermarks or metadata."
    - id: art50-3-emotion-biometric
      risk_class: transparency
      role: deployer
      legal_basis: ["AI-Act/art-50/para-3"]
      citation:
        de: "Artikel 50 Absatz 3 KI-VO"
        en: "Article 50(3) AI Act"
      when:
        - trait: emotion_recognition
          actual: true
      keywords:
        de: [emotionserkennung, biometrische kategorisierung]
        en: [emotion recognition, emotion detection, biometric categorisation, biometric categorization]
      obligation:
        de: "Betroffene Personen müssen über den Einsatz informiert werden; die Datenschutzvorschriften gelten zusätzlich.\n"
        en: "The persons concerned must be informed of the use; data protection rules apply in addition."
    - id: art50-4-deepfake
      risk_class: transparency
      role: deployer
      legal_basis: ["AI-Act/art-50/para-4"]
      citation:
        de: "Artikel 50 Absatz 4 KI-VO"
        en: "Article 50(4) AI Act"
      when:
        - trait: generates_deepfakes
          actual: true
      # Second route: anyone who publishes generated images, sounds or videos must
      # know that paragraph 4 depends on whether they falsely depict an existing place, a
      # person or an event. An invented room with real
      # furniture is as a rule not one; as soon as a real place or a
      # recognisable person appears, the assessment tips. The case is
      # named, not decided - the answer carries needs_review.
      or_when:
        - when:
            - trait: publishes_generated_media
              actual: true
      keywords:
        de: [deepfake, gesicht tauschen, stimme klonen, person imitieren]
        en: [deepfake, face swap, voice cloning, clone voice, impersonate person, impersonation]
      obligation:
        de: "Deepfakes müssen offengelegt werden. Bei Texten zu Angelegenheiten von öffentlichem Interesse gilt die Offenlegungspflicht ebenfalls, wenn der Text nicht von einem Menschen geprüft wurde.\n"
        en: "Deepfakes must be disclosed. For texts on matters of public interest the disclosure obligation also applies if the text has not been reviewed by a human."

# ---------------------------------------------------------------------------
# Tier 6: general-purpose AI models, Articles 51 to 55
# ---------------------------------------------------------------------------
gpai:
  applies_from: 2025-08-02
  # Article 3(63) excludes models used before being placed on the market only for
  # research, development or prototyping activities. If the
  # description says so expressly, the obligations for model providers do
  # not apply. Checking for phrases alone could not see this: "wir
  # bringen es nicht in Verkehr" (we do not place it on the market) contains all words of "modell in verkehr"
  # and triggered the rule - the negation was lost.
  exoneration_phrases:
    de: [nicht in verkehr, nicht veroeffentlich, nicht veröffentlich, nur zur forschung, nur fuer die forschung, nur für die forschung, ausschliesslich fuer die eigene forschung, ausschließlich für die eigene forschung, nur zur eigenen forschung, nur intern, bleibt im unternehmen, nur als prototyp]
    en: [not placed on the market, not place it on the market, not be placed on the market, not put on the market, not bring it to market, not bring it to the market, not commercialis, not commercializ, not publish, not be published, not release, not be released, not made public, not make it public, unpublished, only for research, solely for research, purely for research, for research purposes only, research use only, exclusively for our own research, only for our own research, for our own research only, for internal research only, internal use only, only internally, only used internally, used internally only, stays within the company, remains within the company, stays in the company, remains in the company, stays in-house, remains in-house, only as a prototype, prototype only, just a prototype, only a prototype]
  id: art51-gpai-model
  risk_class: gpai
  legal_basis: ["AI-Act/art-51", "AI-Act/art-53"]
  citation:
    de: "Artikel 51 und 53 KI-VO"
    en: "Articles 51 and 53 AI Act"
  when:
    - trait: is_gpai_model
      actual: true
  keywords:
    de: [basismodell, foundation model, sprachmodell trainieren, allgemeiner verwendungszweck, eigenes modell trainiert]
    en: [foundation model, base model, train language model, train a language model, general-purpose, general purpose, trained our own model, train our own model]
  question:
    de: "Trainieren oder veröffentlichen Sie selbst ein KI-Modell mit allgemeinem Verwendungszweck — also ein Modell, das sich für viele verschiedene Aufgaben einsetzen lässt?\n"
    en: "Do you yourself train or publish a general-purpose AI model, that is, a model that can be used for many different tasks?"
  systemic_risk:
    id: art51-systemic-risk
    risk_class: gpai_systemic_risk
    legal_basis: ["AI-Act/art-51/para-2", "AI-Act/art-55"]
    citation:
      de: "Artikel 51 Absatz 2 und Artikel 55 KI-VO"
      en: "Article 51(2) and Article 55 AI Act"
    threshold_flop: 1.0e25
    presumption:
      de: "Übersteigt der kumulierte Rechenaufwand des Trainings 10^25 Gleitkommaoperationen, wird systemisches Risiko vermutet. Die Vermutung ist widerlegbar; die Kommission kann ein Modell auch ohne Erreichen der Schwelle benennen.\n"
      en: "If the cumulative amount of computation used for training exceeds 10^25 floating-point operations, systemic risk is presumed. The presumption is rebuttable; the Commission can also designate a model without the threshold being reached."
  legacy_models:
    applies_from: 2027-08-02
    text:
      de: "Modelle, die vor dem 2. August 2025 in Verkehr gebracht wurden, müssen die Pflichten bis zum 2. August 2027 erfüllen.\n"
      en: "Models placed on the market before 2 August 2025 must comply with the obligations by 2 August 2027."

# ---------------------------------------------------------------------------
# Tier 7: everything else
# ---------------------------------------------------------------------------
minimal:
  id: minimal-risk
  risk_class: minimal
  legal_basis: ["AI-Act/art-4"]
  citation:
    de: "Artikel 4 KI-VO"
    en: "Article 4 AI Act"
  rationale:
    de: "Das System fällt in keine der besonderen Klassen. Es bleibt die Pflicht zur KI-Kompetenz nach Artikel 4: Anbieter und Betreiber müssen dafür sorgen, dass die Menschen, die das System betreiben oder nutzen, dafür ausreichend geschult sind. Freiwillige Verhaltenskodizes nach Artikel 95 sind möglich.\n"
    en: "The system does not fall into any of the specific classes. The AI literacy obligation under Article 4 remains: providers and deployers must ensure that the people who operate or use the system are sufficiently trained for it. Voluntary codes of conduct under Article 95 are possible."

# ---------------------------------------------------------------------------
# Who counts as provider although initially a deployer: Article 25
# ---------------------------------------------------------------------------
role_change:
  id: art25-becomes-provider
  legal_basis: ["AI-Act/art-25/para-1"]
  citation:
    de: "Artikel 25 Absatz 1 KI-VO"
    en: "Article 25(1) AI Act"
  deployer_becomes_provider_when:
    - de: "Er bringt sein eigenes Zeichen oder seinen Namen auf einem Hochrisiko-KI-System an."
      en: "They put their own name or trademark on a high-risk AI system."
    - de: "Er ändert den Zweck eines Systems so, dass es zum Hochrisiko-KI-System wird."
      en: "They modify the intended purpose of a system in such a way that it becomes a high-risk AI system."
    - de: "Er nimmt eine wesentliche Änderung an einem Hochrisiko-KI-System vor und es bleibt ein Hochrisiko-KI-System."
      en: "They make a substantial modification to a high-risk AI system and it remains a high-risk AI system."
  effect:
    de: "Mit dem Rollenwechsel treffen ihn die vollen Anbieterpflichten. Der ursprüngliche Anbieter ist dann nicht mehr Anbieter dieses Systems, muss aber mitwirken und Unterlagen bereitstellen.\n"
    en: "With the change of role, the full provider obligations apply to them. The initial provider is then no longer the provider of this system, but must cooperate and make documentation available."

# ---------------------------------------------------------------------------
# Deadlines, Article 113, with caveat
# ---------------------------------------------------------------------------
deadlines:
  legal_basis: ["AI-Act/art-113"]
  citation:
    de: "Artikel 113 KI-VO"
    en: "Article 113 AI Act"
  caveat:
    de: "Die Fristen stehen so im Amtsblatt vom 12. Juli 2024. Zum Datenstand dieses Regelsatzes wurden Änderungen einzelner Fristen politisch erörtert. Vor einer Entscheidung mit Geld- oder Rechtsfolgen ist der geltende Stand bei der zuständigen Behörde zu prüfen.\n"
    en: "The deadlines are as published in the Official Journal of 12 July 2024. As of the date of this rule set, changes to individual deadlines were under political discussion. Before a decision with financial or legal consequences, check the current state with the competent authority."
  stages:
    - date: 2024-08-01
      event:
        de: "Die Verordnung tritt in Kraft."
        en: "The Regulation enters into force."
    - date: 2025-02-02
      event:
        de: "Kapitel I und II gelten — die allgemeinen Bestimmungen, die verbotenen Praktiken nach Artikel 5 und die KI-Kompetenz nach Artikel 4.\n"
        en: "Chapters I and II apply: the general provisions, the prohibited practices under Article 5 and AI literacy under Article 4."
    - date: 2025-08-02
      event:
        de: "Pflichten für KI-Modelle mit allgemeinem Verwendungszweck, die Governance-Struktur, die notifizierenden Behörden und die Sanktionen gelten.\n"
        en: "Obligations for general-purpose AI models, the governance structure, the notifying authorities and the penalties apply."
    - date: 2026-08-02
      event:
        de: "Die Verordnung gilt im Übrigen, insbesondere für Hochrisiko-KI-Systeme nach Anhang III und die Transparenzpflichten nach Artikel 50.\n"
        en: "The rest of the Regulation applies, in particular to high-risk AI systems under Annex III and the transparency obligations under Article 50."
    - date: 2027-08-02
      event:
        de: "Hochrisiko-KI-Systeme nach Artikel 6 Absatz 1 in Produkten nach Anhang I sowie KI-Modelle, die vor dem 2. August 2025 in Verkehr gebracht wurden.\n"
        en: "High-risk AI systems under Article 6(1) in products under Annex I, as well as AI models placed on the market before 2 August 2025."

# ---------------------------------------------------------------------------
# Penalties, Article 99
# ---------------------------------------------------------------------------
penalties:
  legal_basis: ["AI-Act/art-99"]
  citation:
    de: "Artikel 99 KI-VO"
    en: "Article 99 AI Act"
  stages:
    - infringement:
        de: "Verbotene Praktik nach Artikel 5"
        en: "Prohibited practice under Article 5"
      amount:
        de: "bis 35 Millionen Euro oder 7 Prozent des weltweiten Jahresumsatzes"
        en: "up to EUR 35 million or 7 % of worldwide annual turnover"
      applicable:
        de: "der höhere Betrag"
        en: "whichever is higher"
    - infringement:
        de: "Verstoß gegen Pflichten für Anbieter, Einführer, Händler, Betreiber, notifizierte Stellen oder gegen Artikel 50\n"
        en: "Infringement of obligations of providers, importers, distributors, deployers, notified bodies or of Article 50"
      amount:
        de: "bis 15 Millionen Euro oder 3 Prozent des weltweiten Jahresumsatzes"
        en: "up to EUR 15 million or 3 % of worldwide annual turnover"
      applicable:
        de: "der höhere Betrag"
        en: "whichever is higher"
    - infringement:
        de: "Falsche, unvollständige oder irreführende Auskunft an Behörden"
        en: "Incorrect, incomplete or misleading information supplied to authorities"
      amount:
        de: "bis 7,5 Millionen Euro oder 1 Prozent des weltweiten Jahresumsatzes"
        en: "up to EUR 7.5 million or 1 % of worldwide annual turnover"
      applicable:
        de: "der höhere Betrag"
        en: "whichever is higher"
  smes:
    de: "Bei kleinen und mittleren Unternehmen einschließlich Start-ups gilt jeweils der niedrigere der beiden Beträge als Obergrenze.\n"
    en: "For small and medium-sized enterprises, including start-ups, the lower of the two amounts applies as the upper limit in each case."
