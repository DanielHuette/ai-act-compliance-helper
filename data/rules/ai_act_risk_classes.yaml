high_risk_annex_iii:
  # If the description expressly says that the result affects no one
  # or remains non-binding, there is no use "for" one of the areas
  # of Annex III. The area is then not assigned. This is deliberately kept
  # narrow: only the express statement counts, not its absence.
  exoneration_phrases:
    de: [unverbindlich, spielt keine rolle, spielen bei beurteilung, keine rolle bei, nicht an die vorgesetzten, nicht gemeldet, geprueft werden teile, geprüft werden teile, nicht menschen, keine personen, nicht ueber menschen, nicht über menschen, nur sachen]
    en: [non-binding, not binding, merely advisory, purely advisory, play no role in the assessment, play no part in the assessment, plays no role in the assessment, plays no part in the assessment, no role in assessments, no role in the decision, no role in decisions, no part in the decision, no part in decisions, no role in appraisals, no role in promotions, no role in performance reviews, has no bearing on the decision, has no bearing on decisions, has no bearing on the assessment, not used in the assessment, not used for the assessment, not passed on to supervisors, not passed to supervisors, not shared with supervisors, not shared with managers, not reported to managers, not reported to supervisors, not reported, parts are inspected, parts are checked, inspects parts, inspects components, not people, not humans, not persons, no persons, no individuals, no people, not about people, not about humans, not about persons, not about individuals, only objects, only inanimate]
  applies_from: 2026-08-02
  general_legal_basis: ["AI-Act/art-6/para-2", "AI-Act/annex-III"]
