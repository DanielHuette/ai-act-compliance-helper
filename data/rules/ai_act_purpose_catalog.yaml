      - de: "Wir drängen Nutzer mit täuschenden Mitteln zu einer Entscheidung, die ihnen schadet."
        en: "We use deceptive techniques to push users into a decision that harms them."
      - de: "Wir setzen Reize unterhalb der Wahrnehmungsschwelle ein, damit Nutzer länger bleiben und mehr kaufen."
        en: "We use stimuli below the threshold of perception so that users stay longer and buy more."
  - citation: AI-Act/art-5/para-1-b
    risk_class: prohibited
    rule: art5-1b-vulnerability
    purposes:
      - de: "Wir nutzen die Schwäche von Kindern, alten oder bedürftigen Menschen aus, um ihr Verhalten zu lenken."
        en: "We exploit the vulnerability of children, older people or people in need to steer their behaviour."
  - citation: AI-Act/art-5/para-1-c
    risk_class: prohibited
    rule: art5-1c-social-scoring
    purposes:
      - de: "Wir bewerten und stufen Menschen nach ihrem Sozialverhalten ein."
        en: "We evaluate and rank people based on their social behaviour."
      - de: "Wir führen einen allgemeinen Punktestand über Personen, der ihnen an anderer Stelle Nachteile bringt."
        en: "We keep a general score on people that puts them at a disadvantage elsewhere."
  - citation: AI-Act/art-5/para-1-d
    risk_class: prohibited
    rule: art5-1d-crime-prediction
    required_words:
      de: [ausschliesslich, ausschließlich, allein, einzig, nur aufgrund, nur anhand, nur auf der grundlage, lediglich]
      en: [solely, exclusively, alone, purely, only on the basis of, based only on, only based on, based solely on, only from, merely]
    purposes:
      - de: "Wir sagen allein aus Persönlichkeitsmerkmalen voraus, ob jemand eine Straftat begehen wird."
        en: "We predict whether someone will commit a crime solely from their personality traits."
    counter_purposes:
      # Article 5(1)(d) prohibits the prediction only when it is
      # based SOLELY on profiling. If it relies on case files,
      # previous convictions or the circumstances of the offence, it is not prohibited but falls under Annex III,
      # point 6(d): high risk with obligations instead of a prohibition.
      # Without this counter-purpose, a recidivism forecast for the police was reported as
      # prohibited, which forbids the user a lawful business.
      - de: "Wir schätzen für die Polizei das Rückfallrisiko aus Akten, Vorstrafen und Tatumständen."
        en: "We estimate the risk of reoffending for the police from case files, previous convictions and the circumstances of the offence."
  - citation: AI-Act/art-5/para-1-e
    risk_class: prohibited
    rule: art5-1e-facial-database
    purposes:
      - de: "Wir sammeln Gesichtsbilder ungezielt aus dem Internet oder aus Überwachungsaufnahmen und bauen daraus eine Gesichtsdatenbank auf."
        en: "We gather facial images from the internet or CCTV footage in an untargeted way and build a database of faces from them."
  - citation: AI-Act/art-5/para-1-f
    risk_class: prohibited
    rule: art5-1f-emotion-work-education
    purposes:
      - de: "Wir erkennen die Gefühle oder die Stimmung von Beschäftigten am Arbeitsplatz."
        en: "We recognise the emotions or mood of employees in the workplace."
      - de: "Wir erkennen die Gefühle von Schülern oder Studierenden in der Schule oder Hochschule."
        en: "We recognise the emotions of pupils or students at school or university."
      - de: "Wir schließen aus Gesicht, Stimme oder Tonfall von Mitarbeitern auf ihre Stimmung."
        en: "We infer employees' mood from their face, voice or tone."
    counter_purposes:
      - de: "Wir erkennen aus Sicherheitsgründen die Müdigkeit eines Fahrers oder Piloten."
        en: "We detect the fatigue of a driver or pilot for safety reasons."
      - de: "Wir erkennen Gefühle aus medizinischen Gründen, etwa zur Behandlung."
        en: "We recognise emotions for medical reasons, for example as part of treatment."
  - citation: AI-Act/art-5/para-1-g
    risk_class: prohibited
    rule: art5-1g-biometric-categorisation
    purposes:
      - de: "Wir schließen aus biometrischen Daten auf Rasse, politische Einstellung, Gewerkschaft, Religion oder Sexualleben."
        en: "We infer race, political opinions, trade union membership, religion or sex life from biometric data."
      - de: "Wir leiten aus Gesichtsfotos die politische Einstellung einer Person ab."
        en: "We infer a person's political views from photos of their face."
      - de: "Wir schließen aus einem Porträtfoto auf die sexuelle Orientierung."
        en: "We infer sexual orientation from a portrait photo."
      - de: "Wir erkennen am Gesicht die Religion oder die Volksgruppe einer Person."
        en: "We recognise a person's religion or ethnic group from their face."
  - citation: AI-Act/art-5/para-1-h
    risk_class: prohibited
    rule: art5-1h-realtime-remote-identification
    purposes:
      - de: "Wir suchen Personen in Echtzeit an öffentlichen Orten per Gesichtserkennung für die Polizei."
        en: "We search for people in real time in public places using facial recognition for the police."
  - citation: AI-Act/art-50/para-1
    risk_class: transparency
    rule: art50-1-interaction
    purposes:
      - de: "Wir bieten einen Chatbot, der sich mit Kunden unterhält."
        en: "We offer a chatbot that talks to customers."
      - de: "Wir beantworten Kundenfragen im Dialog."
        en: "We answer customer questions in a conversation."
      - de: "Wir sprechen am Telefon oder im Chat mit Anrufern."
        en: "We talk to callers on the phone or in a chat."
  - citation: AI-Act/art-50/para-2
    risk_class: transparency
    rule: art50-2-synthetic-content
    purposes:
      - de: "Wir erzeugen mit KI Bilder, Fotos oder Grafiken."
        en: "We use AI to generate images, photos or graphics."
      - de: "Wir erzeugen mit KI Texte."
        en: "We use AI to generate texts."
      - de: "Wir schreiben mit KI ganze Artikel, Beiträge oder Texte aus einem Stichwort."
        en: "We use AI to write complete articles, posts or other texts from just a keyword."
      - de: "Wir erzeugen mit KI Stimmen, Musik oder Tonaufnahmen."
        en: "We use AI to generate voices, music or audio recordings."
      - de: "Wir erzeugen mit KI Videos."
        en: "We use AI to generate videos."
    counter_purposes:
      - de: "Wir korrigieren einen vorhandenen Text nur, ohne ihn inhaltlich zu ändern."
        en: "We only correct an existing text without changing its content."
      - de: "Wir erstellen mit KI Übersichten oder Protokolle für den internen Betrieb und lesen sie selbst gegen."
        en: "We use AI to produce summaries or minutes for internal operations and check them ourselves."
  - citation: AI-Act/art-50/para-3
    risk_class: transparency
    rule: art50-3-emotion-biometric
    purposes:
      - de: "Wir betreiben ein System zur Gefühlserkennung oder zur biometrischen Einteilung."
        en: "We operate an emotion recognition system or a biometric categorisation system."
  - citation: AI-Act/art-50/para-4
    risk_class: transparency
    rule: art50-4-deepfake
    purposes:
      - de: "Wir verändern Bilder oder Videos von echten Menschen so, dass sie etwas tun oder sagen, was nicht geschehen ist."
        en: "We alter images or videos of real people so that they appear to do or say something that never happened."
      - de: "Wir erzeugen Texte zu Themen von öffentlichem Interesse und veröffentlichen sie."
        en: "We generate texts on matters of public interest and publish them."
      - de: "Wir veröffentlichen Bilder oder Videos, die eine KI für uns erzeugt hat."
        en: "We publish AI-generated images or video footage."
  - citation: AI-Act/art-3/pt-63
    risk_class: gpai
    rule: art51-gpai-model
    purposes:
      - de: "Wir trainieren ein eigenes Sprachmodell oder Basismodell und stellen es anderen bereit."
        en: "We train our own language model or foundation model and make it available to others."
      - de: "Wir verkaufen den Zugang zu unserem Modell über eine Programmierschnittstelle an andere Unternehmen."
        en: "We sell access to our model to other companies through an API."
      - de: "Wir veröffentlichen ein vielseitig einsetzbares Modell, das andere in ihre Anwendungen einbauen."
        en: "We release a general-purpose model that others build into their applications."
    counter_purposes:
      - de: "Wir nutzen ein fremdes Modell nur im eigenen Unternehmen."
        en: "We only use a third-party model within our own company."
      - de: "Wir setzen ein Modell nur zur Forschung oder für einen Prototyp ein, ohne es in Verkehr zu bringen."
        en: "We only use a model for research or a prototype, without placing it on the market."
      - de: "Wir trainieren ein Modell ausschließlich für die eigene Forschung und bringen es nicht in Verkehr."
        en: "We train a model exclusively for our own research and do not place it on the market."
