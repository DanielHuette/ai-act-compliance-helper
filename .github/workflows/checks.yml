# Python checks on 3.11-3.13 (the versions pyproject.toml declares). No model is ever downloaded:
# bge-m3 is 2.3 GB, so tests that need it carry the "slow" marker and are excluded here.

name: Checks

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any accidental model download fails at once instead of pulling gigabytes.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints.txt

      # Without the "search" extra (torch), at the exact versions of constraints.txt.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints.txt -e ".[dev]"

      - name: ruff — lint
        run: ruff check --output-format=github .

      - name: ruff — format check
        run: ruff format --check .

      - name: mypy — type check
        run: mypy src

      # No global skips; the few "# nosec" markers each name their rule at the call site.
      - name: bandit — security scan
        run: bandit -c pyproject.toml -r src scripts packaging

      # Audits every pinned version, including the extras that are not installed here.
      - name: pip-audit — known vulnerabilities
        run: pip-audit --disable-pip --no-deps --requirement constraints.txt

      - name: pytest — tests without models
        run: pytest -m "not slow and not network and not container" --color=yes

      # The flow logic exists in Python and in web/walkthrough.js; drift once cost 30 of 217 examples.
      - name: Parity of Python and browser walkthrough
        run: python scripts/check_parity.py --runs 400

      # Expected counts are spelled out so an accidental deletion in a rule file fails the run.
      - name: Rule set and legal bases
        run: python scripts/check_rule_set.py

      - name: Web page catalogs, markup and script name the same keys
        run: python scripts/check_web_locales.py

      - name: Every catalog key is read somewhere
        run: python scripts/find_unused_catalog_keys.py

      # Last because it takes minutes; built with WITH_SEARCH_MODEL=0 (400 MB instead of about
      # 9 GB) and on one Python version only, since the image brings its own.
      - name: pytest — container without network
        if: matrix.python == '3.13'
        run: pytest -m container --color=yes
